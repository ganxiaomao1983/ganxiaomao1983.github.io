<style>
  :root {
    --bg: #faf6ec;
    --surface: #ffffff;
    --surface-sand: #efe3cb;
    --surface-sage: #d9e2ce;
    --text: #26343a;
    --text-soft: #566269;
    --border: #e4dbc7;
    --teal: #1f5d57;
    --teal-dark: #123c38;

  * { box-sizing: border-box; }

  html { scroll-behavior: smooth; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-body);
    font-size: 16px;
    line-height: 1.6;

  }

  img { max-width: 100%; height: auto; display: block; }

  a { color: var(--teal); }

  .wrap {

  h1, h2, h3 {

  .eyebrow {

    font-weight: 600;
    margin-bottom: 0.5em;
    display: block;
  }

  /* Header */
  header.site-header {
    position: sticky;
    top: 0;
    z-index: 100;
    background: rgba(250, 246, 236, 0.96);

  .header-inner {

  }

  .desktop-nav {
    display: flex;
    align-items: center;
    gap: 14px;
    min-width: 0;
  }

  .desktop-nav a {
    text-decoration: none;
    color: var(--text);
    font-size: 0.9rem;
    font-weight: 500;
    white-space: nowrap;
    padding: 8px 0;
  }

  .desktop-nav a:hover { color: var(--teal); }

  .desktop-nav a:focus-visible {
    outline: 3px solid var(--coral);
    outline-offset: 2px;
  }

  .header-actions {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-shrink: 0;
  }

  .menu-toggle {
    display: none;
    align-items: center;
    gap: 8px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--teal-dark);

    padding: 8px 12px;

    font-weight: 700;

  .menu-toggle-icon {

    display: flex;
    flex-direction: column;
    gap: 4px;

  .menu-toggle-icon span {

    width: 18px;
    background: currentColor;
    border-radius: 2px;

    .menu-toggle-icon span { transition: none; }

    bottom: 0;

  table.specs {

<!-- Captures Google Ads GCLID from the landing-page URL and passes it as the affiliate platform uid parameter only when a visitor actively uses an affiliate CTA. -->
<script>
  document.addEventListener("DOMContentLoaded", function () {
    const affiliateBase = "https://pboost.me/t3yGvR1qw";
    const storageKey = "air1_gclid";
    const pageUrl = new URL(window.location.href);
    const urlGclid = pageUrl.searchParams.get("gclid");
    let storedGclid = null;

    try {
      if (urlGclid) {
        sessionStorage.setItem(storageKey, urlGclid);
      }

      storedGclid = sessionStorage.getItem(storageKey);
    } catch (error) {
      storedGclid = null;
    }

    const gclid = urlGclid || storedGclid;
    const affiliateLinks = document.querySelectorAll(
      '[data-affiliate-link="true"]'
    );

    affiliateLinks.forEach(function (link) {
      const affiliateUrl = new URL(affiliateBase);

      if (gclid) {
        affiliateUrl.searchParams.set("uid", gclid);
      }

      link.setAttribute("href", affiliateUrl.toString());
    });
  });
</script>
<script>
  document.addEventListener("DOMContentLoaded", function () {
    const video = document.getElementById("air1-routine-video");
    const overlay = document.getElementById("air1-video-overlay");

    if (!video || !overlay) {
      return;
    }

    function updateVideoOverlay() {
      const currentTime = video.currentTime;

      if (currentTime < 2) {
        overlay.dataset.phase = "1";
      } else if (currentTime < 4.5) {
        overlay.dataset.phase = "2";
      } else if (currentTime < 6) {
        overlay.dataset.phase = "3";
      } else {
        overlay.dataset.phase = "4";
      }
    }

    video.addEventListener("timeupdate", updateVideoOverlay);

    video.addEventListener("play", updateVideoOverlay);

    video.addEventListener("seeked", updateVideoOverlay);

    video.addEventListener("ended", function () {
      overlay.dataset.phase = "4";
    });

    video.addEventListener("pause", function () {
      if (video.currentTime === 0) {
        overlay.dataset.phase = "1";
      }
    });
  });
</script>
<!-- Mobile navigation menu toggle -->
<script>
  document.addEventListener("DOMContentLoaded", function () {
    const menuToggle = document.querySelector(".menu-toggle");
    const mobileNav = document.getElementById("mobile-nav-panel");
    const menuLabel = document.querySelector(".menu-toggle-label");
    const mobileNavLinks = mobileNav
      ? mobileNav.querySelectorAll('a[href^="#"]')
      : [];

    if (!menuToggle || !mobileNav || !menuLabel) {
      return;
    }

    function closeMobileNav() {
      mobileNav.setAttribute("hidden", "");
      menuToggle.setAttribute("aria-expanded", "false");
      menuToggle.setAttribute("aria-label", "Open navigation menu");
      menuToggle.classList.remove("is-open");
      menuLabel.textContent = "Menu";
    }

    function openMobileNav() {
      mobileNav.removeAttribute("hidden");
      menuToggle.setAttribute("aria-expanded", "true");
      menuToggle.setAttribute("aria-label", "Close navigation menu");
      menuToggle.classList.add("is-open");
      menuLabel.textContent = "Close";
    }

    menuToggle.addEventListener("click", function () {
      const isOpen = menuToggle.getAttribute("aria-expanded") === "true";

      if (isOpen) {
        closeMobileNav();
      } else {
        openMobileNav();
      }
    });

    mobileNavLinks.forEach(function (link) {
      link.addEventListener("click", function () {
        closeMobileNav();
      });
    });

    document.addEventListener("keydown", function (event) {
      if (
        event.key === "Escape" &&
        menuToggle.getAttribute("aria-expanded") === "true"
      ) {
        closeMobileNav();
        menuToggle.focus();
      }
    });

    window.addEventListener("resize", function () {
      if (window.innerWidth > 1280) {
        closeMobileNav();
      }
    });
  });
</script>
